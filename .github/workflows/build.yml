name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pyyaml
      - name: Regenerate tables
        run: python scripts/build.py
      - name: Fail if generated files are stale
        if: github.event_name == 'pull_request'
        run: |
          git diff --exit-code -- README.md docs/ || {
            echo "::error::Generated files are out of date. Run 'python scripts/build.py' and commit."
            exit 1
          }
      - name: Commit regenerated tables
        if: github.event_name == 'push'
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add README.md docs/
          git diff --staged --quiet || { git commit -m "chore: rebuild tables"; git push; }
